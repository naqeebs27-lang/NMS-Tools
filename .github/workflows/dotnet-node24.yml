name: Build Calculator Suite

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Display tool versions
        shell: pwsh
        run: |
          node --version
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore CalculatorSuite/CalculatorSuite.csproj

      - name: Build application
        run: dotnet build CalculatorSuite/CalculatorSuite.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows application
        run: dotnet publish CalculatorSuite/CalculatorSuite.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload self-contained Windows application
        uses: actions/upload-artifact@v6
        with:
          name: CalculatorSuite-win-x64
          path: publish
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Inno Setup installer
        shell: pwsh
        run: iscc installer\CalculatorSuite.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: CalculatorSuite-Installer
          path: installer\Output\CalculatorSuite-Setup.exe
          if-no-files-found: error
