name: Build Calculator Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Display tool versions
        shell: pwsh
        run: |
          node --version
          dotnet --version

      - name: Restore dependencies
        run: dotnet restore CalculatorSuite/CalculatorSuite.csproj

      - name: Build application
        run: dotnet build CalculatorSuite/CalculatorSuite.csproj --configuration Release --no-restore

      - name: Publish Windows application
        run: dotnet publish CalculatorSuite/CalculatorSuite.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v5
        with:
          name: CalculatorSuite-win-x64
          path: publish
          if-no-files-found: error
